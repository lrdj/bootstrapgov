<head>

	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	{%- seo -%}

	{%- feed_meta -%}
	{%- if jekyll.environment == 'production' and site.google_analytics -%}
	{%- include google-analytics.html -%}
	{%- endif -%}
	
	<link rel="stylesheet" href="{{ site.baseurl }}/assets/govuk/govuk-frontend.min.css">

	<style>

		/*

  --govuk-frontend-breakpoint-mobile: 20rem;
  --govuk-frontend-breakpoint-tablet: 40.0625rem;
  --govuk-frontend-breakpoint-desktop: 48.0625rem;

		*/


	  @font-face {
	    font-family: "GDS Transport";
	    src: url("{{ site.baseurl }}/assets/govuk/assets/fonts/light-94a07e06a1-v2.woff2") format("woff2"),
	         url("{{ site.baseurl }}/assets/govuk/assets/fonts/light-f591b13f7d-v2.woff") format("woff");
	    font-weight: 300;
	    font-style: normal;
	  }
	  @font-face {
	    font-family: "GDS Transport";
	    src: url("{{ site.baseurl }}/assets/govuk/assets/fonts/bold-b542beb274-v2.woff2") format("woff2"),
	         url("{{ site.baseurl }}/assets/govuk/assets/fonts/bold-affa96571d-v2.woff") format("woff");
	    font-weight: 700;
	    font-style: normal;
	  }

	  /* HMRC timeline pattern — ported from hmrc-frontend's
	     hmrc/components/timeline/_timeline.scss (not part of GOV.UK Frontend).
	     Use with govuk-heading-m on the title and govuk-body on the meta line. */
	  .hmrc-timeline {
	    border-left: 5px solid #1d70b8;
	    margin: 0 0 30px;
	    padding: 0;
	  }
	  .hmrc-timeline__event {
	    position: relative;
	    list-style: none;
	    padding-left: 10px;
	    padding-bottom: 20px;
	  }
	  @media (min-width: 40.0625em) {
	    .hmrc-timeline__event { padding-bottom: 30px; }
	  }
	  .hmrc-timeline__event:last-child { padding-bottom: 0; }
	  .hmrc-timeline__event-title { margin-bottom: 5px; }
	  .hmrc-timeline__event-title::before {
	    content: "";
	    position: absolute;
	    left: 0;
	    top: 0.5em;
	    width: 4px;
	    height: 5px;
	    background-color: #1d70b8;
	  }
	  .hmrc-timeline__event-meta { display: block; margin-bottom: 15px; }

	</style>

	
</head>
